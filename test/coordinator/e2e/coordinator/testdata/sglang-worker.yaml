apiVersion: apps/v1
kind: Deployment
metadata:
  name: sglang-${ROLE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${POOL_NAME}
      llm-d.ai/role: ${ROLE}
  template:
    metadata:
      labels:
        app: ${POOL_NAME}
        llm-d.ai/role: ${ROLE}
    spec:
      containers:
      - name: worker
        image: docker.io/library/python:3.13.9-slim
        command: [python3, /fixture/worker.py]
        env:
        - name: ROLE
          value: ${ROLE}
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
        volumeMounts:
        - name: fixture
          mountPath: /fixture
          readOnly: true
      volumes:
      - name: fixture
        configMap:
          name: sglang-worker
